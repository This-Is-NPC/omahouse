name: Release

on:
  pull_request:
    types: [closed]
    branches: [master]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - name: Run release-please
        id: release
        uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          target-branch: master

  package:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    env:
      TAG: ${{ needs.release-please.outputs.tag_name }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Install the build toolchain
        run: pacman -Syu --noconfirm --needed git github-cli qt6-base qt6-declarative qt6-tools

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}

      # makepkg refuses to run as root, and the recipe copies the tree into its
      # build directory, which therefore has to be outside the checkout.
      - name: Build the package
        run: |
          useradd -m builder
          out=/tmp/omahouse-pkg
          install -d -o builder "$out"
          chown -R builder "$GITHUB_WORKSPACE"
          su builder -c "cd '$GITHUB_WORKSPACE/vm' && \
            BUILDDIR=$out/build PKGDEST=$out/pkg SRCDEST=$out/src LOGDEST=$out/log \
            makepkg -f -d --noconfirm"
          mkdir -p dist
          for pkg in "$out"/pkg/omahouse-[0-9]*.pkg.tar.zst; do
            cp "$pkg" dist/
          done
          cd dist
          ls omahouse-[0-9]*.pkg.tar.zst
          sha256sum omahouse-[0-9]*.pkg.tar.zst > SHA256SUMS

      - name: Attach the package to the release
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          gh release upload "$TAG" dist/omahouse-[0-9]*.pkg.tar.zst dist/SHA256SUMS --clobber
