[tools]
usage = "6.6.0"

[tasks.deps]
description = "Checks the system Qt/qmake toolchain"
run = ".scripts/deps.sh"

[tasks.build]
description = "Builds the CLI and the studio"
run = ".scripts/build.sh"

[tasks.studio]
description = "Opens the window"
run = ".scripts/studio.sh"

[tasks.test]
description = "Builds and runs the unit tests and the CLI e2e"
run = ".scripts/test.sh"

[tasks."studio:test"]
description = "Drives the studio window by keyboard and by mouse, offscreen"
run = ".scripts/studio-check.sh"

[tasks.verify]
description = "Runs the local gate (docs current, then the tests)"
run = ".scripts/verify.sh"

[tasks.lint]
description = "Lints the QML with every warning fatal"
run = ".scripts/qml-check.sh"

[tasks."hooks:install"]
description = "Installs versioned git hooks that exec .scripts/verify.sh"
run = ".scripts/install-hooks.sh"

[tasks.shots]
description = "Regenerates docs/img from the studio itself, offscreen"
run = ".scripts/shots.sh"

[tasks."shots:check"]
description = "Checks that docs/img is what the studio draws today"
run = ".scripts/shots-check.sh"

[tasks."usage:gen"]
description = "Regenerates docs/cli.md from omahouse.usage.kdl"
run = ".scripts/usage-gen.sh"

[tasks."usage:check"]
description = "Checks that docs/cli.md is what omahouse.usage.kdl generates"
run = ".scripts/usage-check.sh"

[tasks."test:vm"]
description = "The VM suite, quick: the smallest windows that still prove each case"
run = "vm/run.sh"

[tasks."test:vm:long"]
description = "The VM suite, long: the windows that catch what only shows with time"
run = "vm/run.sh --pace long"
